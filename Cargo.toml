[package]
name = "RustMindPlot"
version = "1.26.0"
edition = "2024"
description = "RustMindPlot 便携思维导图（PyMindplot 的 Rust 移植版）"

[lib]
name = "rustmindplot"
path = "src/lib.rs"

[[bin]]
name = "RustMindPlot"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
http = "1"
open = "5.4.5"
png = "0.18.1"
quick-xml = { version = "0.37", features = ["encoding"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
wry = "0.57.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
